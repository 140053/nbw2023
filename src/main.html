                  var arc = d3.svg.arc().outerRadius(r);

                  // select paths, use arc generator to draw
                  var arcs = vis
                    .selectAll("g.slice")
                    .data(pie)
                    .enter()
                    .append("g")
                    .attr("class", "slice");

                  arcs
                    .append("path")
                    .attr("fill", function (d, i) {
                      return color(i);
                    })
                    .attr("d", function (d) {
                      return arc(d);
                    });

                  // add the text
                  arcs
                    .append("text")
                    .attr("transform", function (d) {
                      d.innerRadius = 0;
                      d.outerRadius = r;
                      d.angle = (d.startAngle + d.endAngle) / 2;
                      return (
                        "rotate(" +
                        ((d.angle * 180) / Math.PI - 90) +
                        ")translate(" +
                        (d.outerRadius - 10) +
                        ")"
                      );
                    })
                    .attr("text-anchor", "end")

                  container.on("click", spin);

                    //all slices have been seen, all done

                    var ps = 360 / data.length,
                      pieslice = Math.round(1440 / data.length),
                      rng = Math.floor(Math.random() * 1440 + 360);

                    rotation = Math.round(rng / ps) * ps;

                    picked = Math.round(data.length - (rotation % 360) / ps);
                    picked =
                      picked >= data.length ? picked % data.length : picked;
                    if (oldpick.indexOf(picked) !== -1) {
                      d3.select(this).call(spin);
                      return;
                    } else {
                      oldpick.push(picked);
                    }
                    rotation += 90 - Math.round(ps / 2);
                    vis
                      .transition()
                      .duration(3000)
                      .attrTween("transform", rotTween)
                      .each("end", function () {
                        //mark question as seen
                        d3.select(
                          ".slice:nth-child(" + (picked + 1) + ") path"
                        ).attr("fill", "#111");
                        //populate question
                        //d3.select("#question h1").text(data[picked].question);
                        d3.select("#qho").attr("src", data[picked].question);
                        oldrotation = rotation;

                        //answer
                        //d3.select("#question h3").text(data[picked].answer);
                        d3.select("#qans").attr("src", data[picked].answer);
                        //.attr("src", null);
                        oldrotation = rotation;

                        /* Get the result value from object "data" */
                        $("#numpic").empty().text(data[picked].value);
                        console.log(data[picked].value);

                        /* Comment the below line for restrict spin to sngle time */
                        container.on("click", spin);
                      });
                  }

                  //make arrow
                  svg
                    .append("g")
                    .attr(
                      "transform",
                      "translate(" +
                        (w + padding.left + padding.right) +
                        "," +
                        (h / 2 + padding.top) +
                        ")"
                    )
                    .append("path")
                    .attr(
                      "d",
                      "M-" +
                        r * 0.15 +
                        ",0L0," +
                        r * 0.05 +
                        "L0,-" +
                        r * 0.05 +
                        "Z"
                    )
                    .style({ fill: "black" });
                  //draw spin circle
                  container
                    .append("circle")
                    .attr("cx", 0)
                    .attr("cy", 0)
                    .attr("r", 60)
                    .style({ fill: "white", cursor: "pointer" });
                  //spin text
                  container
                    .append("text")
                    .attr("x", 0)
                    .attr("y", 15)
                    .attr("text-anchor", "middle")
                    .text("SPIN")
                    .style({ "font-weight": "bold", "font-size": "30px" });

                  function rotTween(to) {
                    var i = d3.interpolate(oldrotation % 360, rotation);
                    return function (t) {
                      return "rotate(" + i(t) + ")";
                    };
                  }

                  function getRandomNumbers() {
                    var array = new Uint16Array(1000);
                    var scale = d3.scale
                      .linear()
                      .range([360, 1440])
                      .domain([0, 100000]);
                    if (
                      window.hasOwnProperty("crypto") &&
                      typeof window.crypto.getRandomValues === "function"
                    ) {
                      window.crypto.getRandomValues(array);
                      console.log("works");
                    } else {
                      //no support for crypto, get crappy random numbers
                      for (var i = 0; i < 1000; i++) {
                        array[i] = Math.floor(Math.random() * 100000) + 1;
                      }
                    }
                    return array;
                  }
