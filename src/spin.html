                  function spin(d) {
                    container.on("click", null);
                    //all slices have been seen, all done
                    console.log(
                      "OldPick: " + oldpick.length,
                      "Data length: " + data.length
                    );

                    rotation = Math.round(rng / ps) * ps;

                    picked = Math.round(data.length - (rotation % 360) / ps);
                    picked =
                      picked >= data.length ? picked % data.length : picked;
                    if (oldpick.indexOf(picked) !== -1) {
                      d3.select(this).call(spin);
                      return;

                      oldpick.push(picked);
                    }

                  function getRandomNumbers() {

                    if (
                      window.hasOwnProperty("crypto") &&

                    } else {
                      //no support for crypto, get crappy random numbers

                      }
                    }
                    return array;

    <script>
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      function triggerConfetti() {
        const particleCount = 200; // You can adjust the number of particles

        // Generate confetti particles from the left side
        confetti(
          Object.assign({}, defaults, {
            particleCount,
            origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
          })
        );

        // Generate confetti particles from the right side
        confetti(
          Object.assign({}, defaults, {
            particleCount,
            origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
          })
        );
      }
    </script>
    <script>
      function triggerCustomConfetti() {
        const count = 200,
          defaults = {
            origin: { y: 0.7 },
          };

        function fire(particleRatio, opts) {
          confetti(
            Object.assign({}, defaults, opts, {
              particleCount: Math.floor(count * particleRatio),
            })
          );
        }

        fire(0.25, {
          spread: 26,
          startVelocity: 55,
        });

        fire(0.2, {
          spread: 60,
        });

        fire(0.35, {
          spread: 100,
          decay: 0.91,
          scalar: 0.8,
        });

        fire(0.1, {
          spread: 120,
          startVelocity: 25,
          decay: 0.92,
          scalar: 1.2,
        });

        fire(0.1, {
          spread: 120,
          startVelocity: 45,
        });
      }

      // Call the function to trigger the custom confetti
    </script>
    <script>
      function confi3() {
        const end = Date.now() + 15 * 1000;
        const colors = ["#bb0000", "#ffffff"];

        function frame() {
          confetti({
            particleCount: 2,
            angle: 60,
            spread: 55,
            origin: { x: 0 },
            colors: colors,
          });

          confetti({
            particleCount: 2,
            angle: 120,
            spread: 55,
            origin: { x: 1 },
            colors: colors,
          });

          if (Date.now() < end) {
            requestAnimationFrame(frame);
          }
        }

        frame();
      }

      // Call the function to trigger the custom confetti
    </script>

            function Bannetgl(msg, manual) {
              //banner Show

              var rbanner = $("#qabanner");
              if (manual == "hide") {
                if (rbanner.hasClass("d-none") == false) {

              } else {
